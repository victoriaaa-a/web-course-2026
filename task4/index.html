<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра «Быки и коровы»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Быки и коровы</h1>
        
        <div class="controls">
            <input type="text" id="guess-input" placeholder="Введите 4 цифры" maxlength="4" autocomplete="off">
            <button id="check-btn">Проверить</button>
            <button id="new-game-btn">Новая игра</button>
        </div>

        <div id="message" class="message"></div>
        
        <div class="stats">
            <p>Попыток: <span id="attempts-count">0</span></p>
        </div>

        <div class="history-container">
            <h3>История попыток</h3>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
