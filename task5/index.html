<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>

    <main class="game-container">
        <header class="header">
            <h1 class="title">SIMON<span>SAYS</span></h1>
        </header>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-label">LEVEL</span>
                <span class="stat-value" id="levelValue">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">BEST</span>
                <span class="stat-value" id="bestValue">0</span>
            </div>
        </div>

        <div class="status" id="status">Press Start to play</div>

        <div class="board" id="board">
            <div class="sector green" data-id="0"></div>
            <div class="sector red" data-id="1"></div>
            <div class="sector yellow" data-id="2"></div>
            <div class="sector blue" data-id="3"></div>
        </div>

        <button id="startBtn" class="start-btn">
            <span>START</span>
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
